<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="집중 시간을 차분하게 관리하는 Pomodoro 타이머"
    />
    <title>Pomodoro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Pomodoro 홈">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>pomodoro</h1>
        </a>

        <button
          class="icon-button"
          type="button"
          aria-label="설정 열기"
          onclick="location.href='setting.html'"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.25a3.25 3.25 0 1 0 0-6.5 3.25 3.25 0 0 0 0 6.5Z" />
            <path d="M19.43 13.5c.04-.49.04-1.01 0-1.5l1.73-1.35-1.8-3.11-2.03.82a7.7 7.7 0 0 0-1.3-.75L15.72 5h-3.59l-.31 2.61c-.46.2-.89.45-1.29.75L8.49 7.54 6.7 10.65 8.43 12a8.9 8.9 0 0 0 0 1.5L6.7 14.85l1.79 3.11 2.04-.82c.4.3.83.55 1.29.75l.31 2.61h3.59l.31-2.61c.46-.2.9-.45 1.3-.75l2.03.82 1.8-3.11-1.73-1.35Z" />
          </svg>
        </button>
      </header>

      <section class="timer-panel" aria-labelledby="timer-label">
        <div class="session-heading">
          <span class="status-dot" aria-hidden="true"></span>
          <p id="timer-label">Focus session</p>
        </div>

        <div
          class="timer"
          id="timer"
          role="timer"
          aria-live="off"
          aria-label="남은 시간 25분"
        >
          <span id="minutes">25</span><span class="colon">:</span
          ><span id="seconds">00</span>
        </div>

        <p class="encouragement">작은 집중이 큰 변화를 만들어요.</p>

        <div class="controls" aria-label="타이머 조작">
          <button
            class="control-button secondary"
            id="stop-button"
            type="button"
            onclick="stopTimer()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6h12v12H6z" />
            </svg>
            정지
          </button>

          <button
            class="control-button primary"
            id="start-button"
            type="button"
            onclick="startTimer()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 6 9 6-9 6V6Z" />
            </svg>
            시작
          </button>

          <button
            class="control-button secondary"
            id="reset-button"
            type="button"
            onclick="resetTimer()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 8v4h-4" />
              <path d="M18.4 15a7 7 0 1 1-.25-6.33L19 12" />
            </svg>
            초기화
          </button>
        </div>
      </section>

      <footer class="session-footer">
        <span>01</span>
        <div class="progress-track" aria-label="오늘의 첫 번째 집중 세션">
          <span class="progress-value"></span>
        </div>
        <span>04</span>
      </footer>
    </main>
    <script src="index.js"></script>
  </body>
</html>
